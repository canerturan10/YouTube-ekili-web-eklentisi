<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Çekiliş</title>
  <style>
    body { font-family: sans-serif; width: 250px; padding: 15px; margin: 0; background: #f4f4f9; }
    h3 { margin-top: 0; color: #ff0000; font-size: 16px; }
    label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    #start-btn { background: #ff0000; }
    #start-btn:hover { background: #cc0000; }
    #pick-btn { background: #007bff; }
    #pick-btn:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h3>🎁 Çekiliş Yöneticisi</h3>
  
  <label for="keyword">Katılım Kelimesi:</label>
  <input type="text" id="keyword" placeholder="Örn: !katıl">
  
  <label for="winner-count">Kaç Kişi Kazanacak?</label>
  <input type="number" id="winner-count" value="1" min="1">
  
  <button id="start-btn">Dinlemeyi Başlat / Sıfırla</button>
  <button id="pick-btn">Kazananı Seç 🏆</button>
  
  <script src="popup.js"></script>
</body>
</html>
